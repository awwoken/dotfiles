[[language]]
name = "typescript"
formatter = { command = "prettier", args = [
  "--stdin-filepath",
  "%{buffer_name}",
] }
auto-format = true

[[language]]
name = "tsx"
formatter = { command = "prettier", args = [
  "--stdin-filepath",
  "%{buffer_name}",
] }
auto-format = true

[[language]]
name = "toml"
formatter = { command = "taplo", args = ["fmt", "-"] }
auto-format = true
